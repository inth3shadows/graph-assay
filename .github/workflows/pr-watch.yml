# PR watch: once a day, for each open upstream codegraph PR whose head moved since it was last checked (newest
# first, at most CAP per run), build its merge base and its head, replay every fixture in
# fixtures/oracle-candidates on both with this checkout, rerun the changed ones on both, and report which fixtures
# the PR fixes or breaks (tools/fixture-watch.ts pr-*), before it merges. The report is one comment per run on
# this repo's open issue labelled `pr-watch`, with a ready-to-paste review comment per PR. A PR is reported again
# only when its result changes. Nothing is posted to codegraph: a person posts the review comment on the PR after
# checking it. State (head and result per open PR) lives on the `pr-watch-state` branch.
#
# Three jobs, so a write token never shares a runner with code upstream controls: `select` (no upstream code)
# picks the PRs; `replay` (one per PR, read-only token) builds and replays the merge base and the PR head, each
# in the same locked-down container image (no docker socket, no capabilities, no new privileges, no host
# namespaces, no runner environment, no build cache), so a fork's code can't reach the runner's cache or artifact
# tokens; `report` runs only this repo's code on the replay results and alone can write.
# Dry run (report in each replay job's summary; no state, no comment): any pull request touching the watch
# (upstream PR 3454, which fixed issue-3447), or a dispatch with `pr` set.
name: pr-watch
on:
  schedule:
    - cron: '53 6 * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: check only this upstream PR number (a dry run that writes nothing)
        required: false
        default: ''
  pull_request:
    paths:
      # The workflow, the build script, and every file the replay and the watch tool load
      # (lib/manifest-test.ts pins this list to their imports).
      - .github/workflows/pr-watch.yml
      - tools/build-codegraph.sh
      - fixtures/replay.mts
      - lib/config.ts
      - lib/expect.ts
      - lib/fixture-install.ts
      - lib/fixture.ts
      - lib/main.ts
      - lib/package.json
      - lib/provenance.ts
      - lib/sandbox.ts
      - lib/snapshot.ts
      - lib/spec.ts
      - lib/subjects/code-graph-rag.ts
      - lib/subjects/code-review-graph.ts
      - lib/subjects/codebase-memory-mcp.ts
      - lib/subjects/codegraph.ts
      - lib/subjects/index.ts
      - lib/types.ts
      - tools/fixture-watch.ts
      - tools/package.json
permissions: {}
defaults:
  run:
    shell: bash # -eo pipefail: a failed `gh api | node` must fail the step, not feed it an empty list
concurrency:
  group: pr-watch-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
env:
  UPSTREAM: colbymchenry/codegraph
  NODE_VERSION: '22.23.2'
  CAP: '6'
  # The image both sides are built and replayed in (same Node as setup-node).
  SANDBOX_IMAGE: node:22.23.2-bookworm
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
      any: ${{ steps.pick.outputs.any }}
      dry: ${{ steps.pick.outputs.dry }}
      state: ${{ steps.pick.outputs.state }}
      skipped: ${{ steps.pick.outputs.skipped }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Pick the PRs to check
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ inputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p sel
          if [ "$EVENT" = pull_request ]; then PR=3454; fi
          dry=false
          if [ -n "$PR" ]; then
            [[ "$PR" =~ ^[0-9]+$ ]] || { echo "pr must be a number" >&2; exit 1; }
            dry=true
            gh api "repos/$UPSTREAM/pulls/$PR" --jq '[{number, head: .head.sha, base: .base.sha}]' > sel/prs.json
            echo '{"prs":{}}' > sel/state.json
          else
            # Newest-updated first; drafts are skipped.
            gh api --paginate "repos/$UPSTREAM/pulls?state=open&sort=updated&direction=desc&per_page=100" \
              --jq '.[] | select(.draft | not) | {number, head: .head.sha, base: .base.sha}' | node -e '
                const l=require("fs").readFileSync(0,"utf8").trim().split("\n").filter(Boolean).map(JSON.parse);
                require("fs").writeFileSync("sel/prs.json", JSON.stringify(l))'
            rc=0; git ls-remote --exit-code "https://github.com/$REPO.git" refs/heads/pr-watch-state >/dev/null || rc=$?
            if [ "$rc" = 0 ]; then
              git fetch -q --depth=1 "https://github.com/$REPO.git" pr-watch-state
              git show FETCH_HEAD:pr-state.json > sel/state.json
            elif [ "$rc" = 2 ]; then echo '{"prs":{}}' > sel/state.json
            else echo "could not read the pr-watch-state branch (git ls-remote exit $rc)" >&2; exit 1; fi
          fi
          cap=$CAP; [ "$dry" = true ] && cap=1
          node tools/fixture-watch.ts pr-select --prs sel/prs.json --state sel/state.json --cap 1000 > sel/candidates.json
          # Each PR is compared with its merge base, not with the base branch's tip. The cap applies to PRs whose
          # merge base was found; one whose compare answers 404/422 (no such head, no common history) is skipped
          # and recorded as a failed check by the report job, so it can't hold a slot every day.
          CAP_N="$cap" node -e '
            const {execFileSync}=require("child_process"); const fs=require("fs");
            const up=process.env.UPSTREAM; const cap=Number(process.env.CAP_N);
            const ok=[]; const skipped=[]; let errs=0;
            for (const p of JSON.parse(fs.readFileSync("sel/candidates.json","utf8"))) {
              if (ok.length >= cap) break;
              // per_page=1: only the merge base is needed, not the list of commits (a large compare can time out).
              try { p.base=execFileSync("gh",["api",`repos/${up}/compare/${p.base}...${p.head}?per_page=1`,"--jq",".merge_base_commit.sha"],{encoding:"utf8",stdio:["ignore","pipe","pipe"]}).trim(); ok.push(p); errs=0; }
              catch (e) {
                const msg=String(e.stderr || e.message).split("\n")[0];
                // Only a definite answer about this PR (404, 422: no such head, or no common history) counts as a
                // failed check. Any other error (5xx, rate limit, timeout) comes from GitHub, not from the PR: that
                // PR is left for a later run, unrecorded, and the lookups go on; several in a row mean an outage, so
                // they stop, and an outage cannot use up the retry of every waiting PR.
                if (/HTTP (404|422)/.test(msg)) {
                  if (skipped.length < cap) { console.error(`skipping #${p.number}: no merge base (${msg})`); skipped.push({ number: p.number, head: p.head }); }
                  else console.error(`skip limit reached: #${p.number} (${msg}) left for a later run`);
                  continue;
                }
                console.error(`GitHub API error on #${p.number} (${msg}): left for a later run`);
                if (++errs >= 3) { console.error("stopping: GitHub API errors on 3 PRs in a row"); break; }
              }
            }
            fs.writeFileSync("sel/picked.json", JSON.stringify(ok)); fs.writeFileSync("sel/skipped.json", JSON.stringify(skipped))'
          node tools/fixture-watch.ts pr-select --prs sel/picked.json --cap 1000 > sel/checked.json # validates the merge bases
          n=$(node -p 'JSON.parse(require("fs").readFileSync("sel/checked.json","utf8")).length')
          echo "picked $n PR(s): $(cat sel/checked.json); skipped: $(cat sel/skipped.json)"
          # A dry run that checks nothing would pass without testing anything.
          if [ "$dry" = true ] && [ "$n" -eq 0 ]; then echo "dry run: no PR could be checked" >&2; exit 1; fi
          { echo "prs=$(cat sel/checked.json)"; echo "any=$([ "$n" -gt 0 ] && echo true || echo false)"; echo "dry=$dry"
            echo "state=$(sha256sum sel/state.json | cut -d' ' -f1)"; echo "skipped=$(cat sel/skipped.json)"; } >> "$GITHUB_OUTPUT"

  replay:
    needs: select
    if: needs.select.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build and replay the merge base and the PR head, each in the sandbox; rerun the changes on both
        env:
          N: ${{ matrix.pr.number }}
          HEAD_SHA: ${{ matrix.pr.head }}
          BASE_SHA: ${{ matrix.pr.base }}
        run: |
          out="out/pr-$N"; mkdir -p "$out"
          # Both sides are built and replayed in the same container image with the same options, so the only
          # difference between them is the codegraph commit. The container has no docker socket, no privileges,
          # no host namespaces and no runner environment, so the PR head's code (anyone's, often a fork's) can't
          # reach the runner's tokens (cache, artifacts) or this checkout (mounted read-only).
          base_dir="$RUNNER_TEMP/base"; head_dir="$RUNNER_TEMP/head"
          base_out="$RUNNER_TEMP/base-out"; head_out="$RUNNER_TEMP/head-out"
          mkdir -p "$base_dir" "$head_dir" "$base_out" "$head_out"
          sandbox() { # sandbox base|head 'script' [args...]
            local dir out; if [ "$1" = base ]; then dir=$base_dir out=$base_out SHA=$BASE_SHA; else dir=$head_dir out=$head_out SHA=$HEAD_SHA; fi
            docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
              -e HOME=/tmp/home -e N="$N" -e SHA="$SHA" \
              -e CODEGRAPH_REPO="https://github.com/$UPSTREAM.git" \
              -v "$PWD:/ga:ro" -v "$dir:/build" -v "$out:/out" -w /ga \
              "$SANDBOX_IMAGE" bash -eo pipefail -c "mkdir -p \"\$HOME\"; $2" sandbox "${@:3}"
          }
          # A sandbox output is taken only as a regular file of sane size: a symlink planted by the PR's code would
          # otherwise make this runner copy a host file into the artifact (or /dev/zero onto the disk).
          take() { [ -f "$1" ] && [ ! -L "$1" ] && [ "$(stat -c %s "$1")" -lt 50000000 ] && cp -P "$1" "$2" && test -s "$2"; }
          # No build cache in this workflow: both sides are built here, in the container, every run.
          sandbox base 'git clone -q --filter=blob:none "$CODEGRAPH_REPO" /build
            tools/build-codegraph.sh "$SHA" /build >/dev/null
            node fixtures/replay.mts /build/dist/bin/codegraph.js --json /out/prev.json || true'
          sandbox head 'git clone -q --filter=blob:none "$CODEGRAPH_REPO" /build
            git -C /build fetch -q origin "pull/$N/head"
            tools/build-codegraph.sh "$SHA" /build >/dev/null
            node fixtures/replay.mts /build/dist/bin/codegraph.js --json /out/next.json || true'
          take "$base_out/prev.json" "$out/prev.json"
          take "$head_out/next.json" "$out/next.json"
          node tools/fixture-watch.ts flips --prev "$out/prev.json" --next "$out/next.json" --fixtures fixtures/oracle-candidates > "$out/flips.txt"
          mapfile -t flips < "$out/flips.txt"
          if [ "${#flips[@]}" -gt 0 ]; then
            sandbox head 'node fixtures/replay.mts /build/dist/bin/codegraph.js "$@" --json /out/confirm-next.json || true' "${flips[@]}"
            sandbox base 'node fixtures/replay.mts /build/dist/bin/codegraph.js "$@" --json /out/confirm-prev.json || true' "${flips[@]}"
            take "$head_out/confirm-next.json" "$out/confirm-next.json"
            take "$base_out/confirm-prev.json" "$out/confirm-prev.json"
          fi
      - name: Report (job summary; issue states unknown here)
        env:
          N: ${{ matrix.pr.number }}
          PR_JSON: ${{ toJSON(matrix.pr) }}
        run: |
          printf '[%s]' "$PR_JSON" > out/this.json
          echo '[]' > out/open.json
          node tools/fixture-watch.ts pr-report --prs out/this.json --dir out --graph-assay "$GITHUB_SHA" --open out/open.json \
            --fixtures fixtures/oracle-candidates --report-out out/capped.md --state-out out/unused.json --summary-out out/summary.md
          if [ -s out/summary.md ]; then cat out/summary.md; else echo "PR #$N: no fixture changes."; fi >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: pr-${{ matrix.pr.number }}
          path: |
            out/pr-${{ matrix.pr.number }}/prev.json
            out/pr-${{ matrix.pr.number }}/next.json
            out/pr-${{ matrix.pr.number }}/confirm-prev.json
            out/pr-${{ matrix.pr.number }}/confirm-next.json
          if-no-files-found: error
          retention-days: 5

  report:
    needs: [select, replay]
    # Runs even if some PR's replay failed: that PR is left unchecked and tried again next run.
    # Not on cancel: a cancelled run would count its unfinished PRs as failed checks.
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.dry == 'false' && (needs.select.outputs.any == 'true' || needs.select.outputs.skipped != '[]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      PRS: ${{ needs.select.outputs.prs }}
      STATE_SHA: ${{ needs.select.outputs.state }}
      SKIPPED: ${{ needs.select.outputs.skipped }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: pr-*
          path: artifact
      - name: Open PRs, stored state, issue states
        run: |
          # The PR list comes from the select job (which ran no upstream code); the replay jobs' artifacts are
          # read only as each PR's four result files, by `pr-report`.
          mkdir -p rep
          printf '%s' "$PRS" > rep/prs.json
          printf '%s' "$SKIPPED" > rep/skipped.json
          gh api --paginate "repos/$UPSTREAM/pulls?state=open&per_page=100" --jq '.[].number' | node -e '
            const l=require("fs").readFileSync(0,"utf8").trim().split("\n").filter(Boolean).map(Number);
            require("fs").writeFileSync("rep/open.json", JSON.stringify(l))'
          rc=0; git ls-remote --exit-code "https://github.com/$REPO.git" refs/heads/pr-watch-state >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git fetch -q --depth=1 "https://github.com/$REPO.git" pr-watch-state
            git show FETCH_HEAD:pr-state.json > rep/state.json
          elif [ "$rc" = 2 ]; then echo '{"prs":{}}' > rep/state.json
          else echo "could not read the pr-watch-state branch (git ls-remote exit $rc)" >&2; exit 1; fi
          # The state must be the one select picked from: a re-run of an old run, or a hand edit since, is refused.
          [ "$(sha256sum rep/state.json | cut -d' ' -f1)" = "$STATE_SHA" ] || { echo "pr-watch-state changed since this run picked its PRs" >&2; exit 1; }
          echo '{}' > rep/issue-states.json
          # Written to a file first: a failing pr-issues must fail the step, not look like "no issues".
          node tools/fixture-watch.ts pr-issues --prs rep/prs.json --dir artifact --fixtures fixtures/oracle-candidates > rep/issues.txt
          for n in $(cat rep/issues.txt); do
            s=$(gh api "repos/$UPSTREAM/issues/$n" --jq .state) || s=unknown # deleted, moved or rate-limited
            node -e 'const f=process.argv[1],s=JSON.parse(require("fs").readFileSync(f));s[process.argv[2]]=process.argv[3];require("fs").writeFileSync(f,JSON.stringify(s))' rep/issue-states.json "$n" "$s"
          done
      - name: Write the report
        run: |
          node tools/fixture-watch.ts pr-report --prs rep/prs.json --dir artifact --graph-assay "$GITHUB_SHA" --open rep/open.json \
            --state rep/state.json --skipped rep/skipped.json --issue-states rep/issue-states.json --fixtures fixtures/oracle-candidates \
            --report-out rep/report.md --state-out rep/new-state.json --summary-out rep/full.md
          if [ -s rep/full.md ]; then cat rep/full.md; else echo "No PR result changed."; fi >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the tracking issue
        run: |
          [ -s rep/report.md ] || { echo "No PR result changed."; exit 0; }
          n=$(gh issue list -R "$REPO" --label pr-watch --state open --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            gh label create pr-watch -R "$REPO" --color 1d76db --description "Fixture results on open upstream codegraph PRs (pr-watch.yml)" 2>/dev/null || true
            url=$(gh issue create -R "$REPO" --label pr-watch --title "PR watch: fixture results on open upstream codegraph PRs" \
              --body "Each comment here is one run of .github/workflows/pr-watch.yml that found an open upstream PR fixing or breaking a fixture. The review comments in them are drafts: re-check on the PR's current head and post by hand.")
            n=${url##*/}
          fi
          gh issue comment "$n" -R "$REPO" --body-file rep/report.md
      - name: Store the new state
        run: |
          # After the comment: a failed push re-reports next run, which beats a result nobody hears about.
          d=$(mktemp -d)
          url="https://x-access-token:${GH_TOKEN}@github.com/$REPO.git"
          git -C "$d" init -q
          git -C "$d" config user.name "github-actions[bot]"
          git -C "$d" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rc=0; git ls-remote --exit-code "$url" refs/heads/pr-watch-state >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git -C "$d" fetch -q --depth=1 "$url" pr-watch-state
            git -C "$d" checkout -q -b pr-watch-state FETCH_HEAD
          elif [ "$rc" = 2 ]; then
            git -C "$d" checkout -q --orphan pr-watch-state
          else echo "could not read the pr-watch-state branch (git ls-remote exit $rc)" >&2; exit 1; fi
          cp rep/new-state.json "$d/pr-state.json"
          git -C "$d" add pr-state.json
          if git -C "$d" diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git -C "$d" commit -q -m "pr-watch $(date -u +%F)"
          git -C "$d" push -q "$url" HEAD:refs/heads/pr-watch-state
