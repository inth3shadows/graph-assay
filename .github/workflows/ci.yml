# Hermetic checks: no codegraph build, no SCIP tools, no corpus. Syntax of every script, every
# fixture's expect.json, and the oracle self-tests with the rule-mutation pass (`bin/graph-assay check`).
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.23.2'
      - run: npm ci --ignore-scripts
      - run: node bin/graph-assay check
